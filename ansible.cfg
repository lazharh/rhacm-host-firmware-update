[defaults]
ask_vault_pass = True
inventory=./inventory
remote_user=your_username
collections_path=$HOME/Documents/Trainings/PythonCode/venv/lib/python3.13/site-packages/ansible_collections:./collections:~/.ansible/collections:/usr/share/ansible/collections
#collections_path=./collections:~/.ansible/collections:/usr/share/ansible/collections
collections_scan_sys_path=False

library=$HOME/.ansible/plugins/modules:/usr/share/ansible/plugins/modules
module_utils=$HOME/.ansible/plugins/module_utils:/usr/share/ansible/plugins/module_utils

[privilege_escalation]
become=False
become_method=sudo
become_user=root
become_ask_pass=False

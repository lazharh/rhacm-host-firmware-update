---
# Batch firmware update across multiple spoke clusters.
# Nodes within the same spoke are updated one at a time (serial).
# Spokes are also processed serially (safe default).
#
# Usage:
#   ansible-playbook playbook-batch.yml -e @vars/batch.yml
#   ansible-playbook playbook-batch.yml -e @vars/batch.yml -e trigger_reboot=false

- name: Batch update spoke host firmware via RHACM hub + Metal3
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  collections:
    - kubernetes.core
    - community.general

  vars_files:
    - vars/batch.yml

  tasks:
    - name: Ensure required Ansible collections are installed
      ansible.builtin.command:
        cmd: ansible-galaxy collection list {{ item }}
      loop:
        - kubernetes.core
        - community.general
      register: collection_check
      changed_when: false
      failed_when: collection_check.rc != 0

    - name: Validate spokes list
      ansible.builtin.assert:
        that:
          - hub_api_url | length > 0
          - hub_username | length > 0
          - hub_password | length > 0
          - spokes is defined
          - spokes | length > 0
        fail_msg: Set hub_* credentials and a non-empty spokes list in vars/batch.yml.

    - name: Authenticate to hub OpenShift using username/password
      kubernetes.core.k8s_auth:
        host: "{{ hub_api_url }}"
        password: "{{ hub_password }}"
        username: "{{ hub_username }}"
        state: present
        validate_certs: false
      register: hub_auth_result
      when: hub_username != "" and hub_password != "" and hub_api_url != ""

    - name: "Process spoke cluster (serial) — {{ spoke.namespace }}"
      ansible.builtin.include_tasks: tasks/update_spoke_nodes.yml
      loop: "{{ spokes }}"
      loop_control:
        loop_var: spoke
        label: "{{ spoke.namespace }}"

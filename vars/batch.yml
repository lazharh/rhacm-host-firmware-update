---
# Batch inventory for playbook-batch.yml
#
# - Hub credentials are shared.
# - Each spoke has its own API URL, login, firmware URLs, and node list.
# - Nodes in the same spoke are updated one at a time.
# - Optional per-node bios_firmware_url / bmc_firmware_url override the spoke defaults.

hub_api_url: "https://api.lzhacm.se-lab.eng.rdu2.dc.redhat.com:6443"
hub_username: "kubeadmin"
hub_password: ""

# Global flags / timeouts (role defaults apply if omitted)
trigger_reboot: true
restore_rhacm_pause: true
uncordon_after_update: true

spokes:
  # Example Dell SNO — copy/adjust entries per cluster
  - namespace: sno-hnn3sy3
    api_url: "https://api.sno-hnn3sy3.se-lab.eng.rdu2.dc.redhat.com:6443"
    username: "kubeadmin"
    password: ""
    bios_firmware_url: "http://refarch.se-apps.redhat.com//pub/firmware/dell/BIOS_DCFN9_WN64_1.21.1.EXE"
    bmc_firmware_url: "http://refarch.se-apps.redhat.com//pub/firmware/dell/iDRAC_7.30.30.51_A00/firmimgFIT.d9"
    nodes:
      - bmh_name: master-0.sno-hnn3sy3.se-lab.eng.rdu2.dc.redhat.com
        spoke_node_name: master-0.sno-hnn3sy3.se-lab.eng.rdu2.dc.redhat.com

  # Add another spoke (different hardware/firmware) like this:
  # - namespace: sno-other
  #   api_url: "https://api.sno-other...."
  #   username: "kubeadmin"
  #   password: "..."
  #   bios_firmware_url: "http://.../other/BIOS.bin"
  #   bmc_firmware_url: "http://.../other/BMC.bin"
  #   nodes:
  #     - bmh_name: master-0.sno-other...
  #       spoke_node_name: master-0.sno-other...
  #     # Second node waits until the first finishes
  #     - bmh_name: worker-0.sno-other...
  #       spoke_node_name: worker-0.sno-other...
  #       # optional node-level override:
  #       # bios_firmware_url: "http://.../worker-sku/BIOS.bin"
